version: '3.8'

services:
  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    ports:
      - "8080:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false

  flask:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flask-url-shortener
    ports:
      - "5000:5000"
    depends_on:
      - jenkins
    volumes:
      - .:/app

volumes:
  jenkins_home:
